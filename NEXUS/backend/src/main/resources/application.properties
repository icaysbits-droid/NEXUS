spring.application.name=nexus-backend

# ===================================================================
# CONEXIÓN A POSTGRESQL (Soporta Docker y ejecución Local en IDE)
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIBERNATE / JPA
# ===================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# SEGURIDAD HTTP, PROXY Y CARGA DE ARCHIVOS (CSF)
# ===================================================================
server.forward-headers-strategy=framework
server.error.include-stacktrace=never
server.error.include-message=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# SEGURIDAD Y AUTENTICACIÓN JWT (Obligatorio por Variable de Entorno)
# ===================================================================
# Sin valor por defecto hardcodeado (fail-fast). Genere con: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
# Tiempo de expiración del token en milisegundos (24 horas = 86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
