spring.application.name=nexus-backend

# ===================================================================
# CONEXIÓN A POSTGRESQL (Soporta Docker y ejecución Local en IDE)
# ===================================================================
# Si está en Docker usa el host 'database', si está en local usa 'localhost'
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexus_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexus_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# HIBERNATE / JPA: CREACIÓN AUTOMÁTICA DE TABLAS
# ===================================================================
# 'update': Lee las clases con @Entity y crea/actualiza las tablas en PostgreSQL automáticamente
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Muestra en la terminal las sentencias SQL (CREATE TABLE, INSERT, etc.)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# SEGURIDAD Y AUTENTICACIÓN JWT (Alta Entropía + Variables de Entorno)
# ===================================================================
# En producción o Docker se inyecta mediante la variable de entorno JWT_SECRET.
# La clave por defecto de desarrollo posee 512 bits (64 bytes hexadecimales) de entropía criptográfica.
jwt.secret=${JWT_SECRET:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08e4c7b9a2d1f3e5a7c9b0d2e4f6a8b1c3d5e7f9a0b2c4d6e8f0a1b3c5d7e9f1a2}
# Tiempo de expiración del token en milisegundos (24 horas = 86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
