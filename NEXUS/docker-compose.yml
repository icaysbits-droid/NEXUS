version: '3.8'

services:  
  database:
    image: postgres:16-alpine
    container_name: nexus-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nexus-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports: 
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/nexus_db
      - SPRING_DATASOURCE_USERNAME=nexus_user
      - SPRING_DATASOURCE_PASSWORD=nexus_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - database
    networks:
      - nexus-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend 
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  pgdata: # <--- ¡ESTE BLOQUE ERA EL QUE FALTABA!