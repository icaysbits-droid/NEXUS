version: '3.8'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    restart: unless-stopped
    ports: 
      - "8080:8080"
    volumes:
      - ./backend:/app  - /app/node_modules
    depends_on:
      - database
    networks:
      - nexus-network
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend 
    volumes:
      - ./frontend:/app
    networks:
      - nexus-network
networks:
  nexus-network:
    driver: bridge
